name: Build Android APK & Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'הערות מהדורה (אופציונלי)'
        required: false
        default: 'גרסת פיתוח אוטומטית של גל־קול - מעבדת שמע מתקדמת'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: |
          gradle :app:testDebugUnitTest --no-daemon

      - name: Build Android APK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Verify APK Exists & Prepare Release Asset
        id: prepare_apk
        run: |
          VERSION_TAG="v1.0.${{ github.run_number }}"
          APK_NAME="GalKol-${VERSION_TAG}.apk"
          SOURCE_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -z "$SOURCE_APK" ] || [ ! -f "$SOURCE_APK" ]; then
            echo "::error::APK file was not generated by Gradle build!"
            exit 1
          fi

          mkdir -p release_output
          cp "$SOURCE_APK" "release_output/${APK_NAME}"
          echo "APK successfully built: release_output/${APK_NAME}"

          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "apk_path=release_output/${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.version_tag }}
          name: "מהדורה ${{ steps.prepare_apk.outputs.version_tag }} | גל־קול"
          body: |
            ## גל־קול | מעבדת שמע מתקדמת (${{ steps.prepare_apk.outputs.version_tag }})
            **שומעים. רואים. מבינים.**

            ### מה חדש בגרסה זו?
            - ${{ github.event.inputs.release_notes }}
            - עיבוד אותות אקוסטי ספרתי (DSP) מלא בזמן אמת.
            - ניתוח ספקטרום FFT, ספקטרוגרמה ומדידות עוצמה (dBFS / dB SPL).
            - הקלטת שמע בפורמט WAV 16-bit וניתוח קובצי שמע מהמכשיר.
            - הפקת דוחות PDF, CSV ו־JSON והשוואת מדידות.

            > **הערה חשובה:** קובץ זה הינו Debug APK שנוצר באמצעות בנייה אוטומטית. לצורך התקנה במכשיר ייתכן שיידרש אישור התקנת יישומים ממקורות לא ידועים.
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "###  הבנייה והמהדורה הושלמו בהצלחה!" >> $GITHUB_STEP_SUMMARY
          echo "- **גרסה:** \`${{ steps.prepare_apk.outputs.version_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **שם קובץ:** \`${{ steps.prepare_apk.outputs.apk_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **קישור למהדורה ב־GitHub:** [צפה במהדורה ב־Releases](https://github.com/${{ github.repository }}/releases/tag/${{ steps.prepare_apk.outputs.version_tag }})" >> $GITHUB_STEP_SUMMARY
